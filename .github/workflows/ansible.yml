name: Validate Ansible quickstart

on:
  pull_request:
    paths:
      - ".github/workflows/ansible.yml"
      - "mcp-server/**"
      - "dbt_project/**"
      - "docs/oss/dbt_project/**"
      - "docs/oss/quickstart/ansible/README.md"
      - "docs/oss/mcp-server/README.md"
      - "docs/oss/quickstart/vm_rawbbit_two/README.md"
      - "quickstart/ansible/**"
      - "quickstart/vm_rawbbit_one/**"
      - "quickstart/vm_rawbbit_two/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ansible.yml"
      - "mcp-server/**"
      - "dbt_project/**"
      - "docs/oss/dbt_project/**"
      - "docs/oss/quickstart/ansible/README.md"
      - "docs/oss/mcp-server/README.md"
      - "docs/oss/quickstart/vm_rawbbit_two/README.md"
      - "quickstart/ansible/**"
      - "quickstart/vm_rawbbit_one/**"
      - "quickstart/vm_rawbbit_two/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check OSS Ansible guide mirror
        run: |
          if ! cmp -s quickstart/ansible/README.md docs/oss/quickstart/ansible/README.md; then
            echo "::error::OSS Ansible guide differs from the canonical guide. Copy quickstart/ansible/README.md to docs/oss/quickstart/ansible/README.md."
            diff -u quickstart/ansible/README.md docs/oss/quickstart/ansible/README.md
            exit 1
          fi

      - name: Check focused dataset documentation parity
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = (
              ("mcp-server/README.md", "docs/oss/mcp-server/README.md"),
              ("quickstart/vm_rawbbit_two/README.md", "docs/oss/quickstart/vm_rawbbit_two/README.md"),
              ("quickstart/ansible/README.md", "docs/oss/quickstart/ansible/README.md"),
          )
          start = "<!-- dataset-mcp:start -->"
          end = "<!-- dataset-mcp:end -->"

          def section(path: str) -> str:
              text = Path(path).read_text(encoding="utf-8")
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"{path}: expected exactly one dataset documentation marker pair")
              body = text.split(start, 1)[1].split(end, 1)[0]
              return body

          for internal, staged in pairs:
              if section(internal) != section(staged):
                  raise SystemExit(f"dataset documentation differs: {internal} != {staged}")
          print("focused dataset documentation sections match")
          PY

      - name: Validate base and opt-in Compose configurations
        run: |
          (cd mcp-server && \
            docker compose --env-file .env.example -f docker-compose.yml config --quiet && \
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.datasets.yml config --quiet)
          (cd quickstart/vm_rawbbit_two && \
            docker compose --env-file .env.example -f docker-compose.yml config --quiet && \
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.datasets.yml config --quiet && \
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dozzle.yml config --quiet && \
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dozzle.yml -f docker-compose.datasets.yml config --quiet)

      - name: Check focused routing documentation parity
        run: |
          python - <<'PY'
          from pathlib import Path

          def section(path):
              text = Path(path).read_text(encoding="utf-8")
              start, end = "<!-- dbt-routing:start -->", "<!-- dbt-routing:end -->"
              assert text.count(start) == text.count(end) == 1, path
              return text.split(start, 1)[1].split(end, 1)[0]

          assert section("quickstart/vm_rawbbit_two/README.md") == section(
              "docs/oss/quickstart/vm_rawbbit_two/README.md"
          )
          assert Path("dbt_project/README.md").read_bytes() == Path(
              "docs/oss/dbt_project/README.md"
          ).read_bytes()
          print("routing documentation parity passed")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible validation tools
        run: >-
          python -m pip install
          'ansible-core==2.19.11'
          'ansible-lint==25.12.2'

      - name: Install required Ansible collections
        run: >-
          ansible-galaxy collection install
          -r quickstart/ansible/requirements.yml

      - name: Check VM-two dataset preflight installer ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          tasks = yaml.safe_load(Path("quickstart/ansible/roles/rawbbit_two/tasks/main.yml").read_text())
          indexes = {task["name"]: index for index, task in enumerate(tasks) if isinstance(task, dict) and "name" in task}

          def task(name):
              return tasks[indexes[name]]

          journal_stat = indexes["Check whether a prior dataset ownership journal exists"]
          set_fact = indexes["Determine whether dataset isolation state must be retained"]
          make_dir = task("Create root-owned ClickHouse provisioning directory")
          install = task("Install privileged dataset provisioner and canonical schema")
          preflight = task("Preflight dataset ownership and main-user isolation before mutation")
          assert journal_stat < set_fact < indexes["Install privileged dataset provisioner and canonical schema"] < indexes[
              "Preflight dataset ownership and main-user isolation before mutation"
          ]
          set_fact_task = task("Determine whether dataset isolation state must be retained")
          set_fact_action = next(
              value for key, value in set_fact_task.items()
              if key == "set_fact" or key.endswith(".set_fact")
          )
          expression = set_fact_action["rawbbit_two_dataset_preflight_required"]
          assert "rawbbit_two_datasets | length > 0" in expression
          assert "rawbbit_two_dataset_journal_stat.stat.exists" in expression
          expected_when = "rawbbit_two_dataset_preflight_required | bool"
          assert make_dir["when"] == expected_when
          assert install["when"] == expected_when
          assert preflight["when"] == expected_when

          def needs_preflight(dataset_count, journal_exists):
              return dataset_count > 0 or journal_exists

          assert needs_preflight(1, False)  # fresh all-disabled registry
          assert needs_preflight(0, True)   # removed registry with retained journal
          assert not needs_preflight(0, False)  # fresh empty installation
          print("VM-two dataset preflight/install guards and ordering passed")
          PY

      - name: Run playbook syntax checks
        working-directory: quickstart/ansible
        run: |
          ansible-playbook -i inventory.example.yml vm_one.yml --syntax-check
          ansible-playbook -i inventory.example.yml vm_two.yml --syntax-check
          ansible-playbook -i inventory.example.yml site.yml --syntax-check

      - name: Run ansible-lint
        run: ansible-lint quickstart/ansible

  mcp-and-provisioner-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP and test dependencies
        run: |
          python -m pip install -r mcp-server/requirements.txt pytest

      - name: Run MCP and provisioner tests
        env:
          PYTHONPATH: mcp-server/src
        run: >-
          python -m pytest -q mcp-server/tests quickstart/vm_rawbbit_two/clickhouse/tests

  dbt-runner-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest PyYAML

      - name: Validate runner and deployment contracts
        run: >-
          python -m pytest -q dbt_project quickstart/vm_rawbbit_two
          --ignore=dbt_project/integration_tests

  dbt-routing-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dbt adapter and integration test tools
        run: python -m pip install -r dbt_project/requirements.txt pytest pyarrow

      - name: Exercise routed incremental ingestion on disposable ClickHouse
        env:
          RAWBBIT_DBT_INTEGRATION: "1"
        run: python -m pytest -q dbt_project/integration_tests
