name: OSS ingest unit tests

on:
  pull_request:
    paths:
      - "backend/collector-api/**"
      - "backend/raw-writer/**"
      - ".github/workflows/oss-ingest-unit-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/collector-api/**"
      - "backend/raw-writer/**"
      - ".github/workflows/oss-ingest-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.service }} unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        service:
          - collector-api
          - raw-writer
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install service and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt 'pytest==9.0.2'

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run unit tests
        run: python -m pytest -q tests
