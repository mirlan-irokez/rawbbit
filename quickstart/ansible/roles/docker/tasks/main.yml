---
- name: Validate Docker architecture support
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture in docker_apt_architectures
    fail_msg: "Unsupported Docker apt architecture: {{ ansible_facts.architecture }}"

- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker's official Ubuntu repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_architectures[ansible_facts.architecture] }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Add the deployment operator to the Docker group
  ansible.builtin.user:
    name: "{{ rawbbit_deploy_user }}"
    groups: docker
    append: true
  register: docker_group_membership

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Reset SSH connection after Docker group membership changes  # noqa no-handler
  ansible.builtin.meta: reset_connection
  when: docker_group_membership.changed

- name: Verify Docker Engine
  ansible.builtin.command: docker version
  become: false
  changed_when: false

- name: Verify Docker Compose
  ansible.builtin.command: docker compose version
  become: false
  changed_when: false
