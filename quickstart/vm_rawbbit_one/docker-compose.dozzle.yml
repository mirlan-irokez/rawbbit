services:
  caddy:
    environment:
      DOZZLE_PUBLIC_HOSTNAME: ${DOZZLE_PUBLIC_HOSTNAME:?DOZZLE_PUBLIC_HOSTNAME is required}

  dozzle:
    image: amir20/dozzle:v10.6.13
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_MCP: "true"
      DOZZLE_HOSTNAME: rawbbit-one
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/rawbbit-one/dozzle:/data
